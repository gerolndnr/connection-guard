name: Release 0.6.1 public metadata
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read official public versions and verify runtime downloads
        run: python3 ci/release_061_metadata.py
      - name: Retain official metadata and runtime hashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connection-guard-release-061-public-metadata
          path: release-metadata/
          retention-days: 7
