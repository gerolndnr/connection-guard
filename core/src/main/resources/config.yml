# Connection Guard starts in observation mode on a new installation.
# Review /cg doctor and provider terms, then deliberately choose ENFORCE.
operation:
  mode: OBSERVE
identity:
  # Only enable after protecting the backend and verifying proxy/Floodgate forwarding.
  trust-forwarded-uuid: false
  floodgate:
    # Opt in only with an installed canonical Floodgate API and a protected gateway key.
    # Matches the active record, canonical UUID/name and current client IP+port.
    # Missing, retired, mismatched or unbound records grant no native exception.
    enabled: false
  # Native verified gateway assertions on explicitly qualified Paper/Folia builds.
  # Does not authenticate accounts or configure Velocity. See docs/NATIVE_IDENTITY.md.
  paper-modern-forwarding:
    enabled: false

failure-policy:
  # OPEN allows UNKNOWN; CLOSED rejects temporarily without commands/bans/webhooks.
  # OBSERVE allows UNKNOWN; inspect explain/providers for the reason.
  vpn: OPEN
  geo: OPEN
lookup:
  # One eligible-login check budget: permissions, admission, cache and detection.
  # Late facts cannot alter that login. Shared detector work can serve another caller.
  deadline-ms: 5000
  http-timeout-ms: 2500
  workers: 8
  queue-capacity: 64
  max-inflight: 128
  circuit:
    failures: 3
    pause-ms: 30000

# Optional admission limits for real login checks (not /cg explain).
# Limits are disabled by default; tune for households, shared IPs and events.
# Refusals skip detection. Only deny-connections can temporarily refuse access;
# provider failure-policy does not change this choice. OBSERVE suppresses refusal.
overload:
  enabled: false
  deny-connections: false
  window-ms: 10000
  cooldown-ms: 10000
  alarm-cooldown-ms: 30000
  global-attempts: 0
  per-ip-attempts: 0
  per-subnet-attempts: 0
  ipv4-prefix: 24
  ipv6-prefix: 64
  tracking-capacity: 4096

# Third-party providers register through the versioned API, then require explicit
# selection and /cg reload. Missing/closed modules stay UNKNOWN. See API docs.
integrations:
  # Read-only pre-admission policy checks. CLEAR never bypasses guard rules.
  admission:
    enabled: false
    ids: []
    failure-policy: OPEN
  providers:
    enabled: false
    sources: []
  # Trusted addons only; callbacks receive IP/source facts and trusted UUIDs.
  # Best effort on two workers with a finite queue; never use this as a ban/challenge authorization.
  observers:
    enabled: false
    ids: []

# Message config used for all messages send to the player.
# You can add your own languages by creating a file called <language>.yml and setting the
# entry below to the file name without the .yml extension.
message-language: 'en'

# Settings about how to behave when finding a vpn or geo-blocked user.
behavior:
  vpn:
    # If set to true, players connected to a vpn cannot join the server.
    kick-player: true
    # If set to true, players with the permission connectionguard.notify.vpn will receive a notification message
    # when a player connected to a vpn tries to connect.
    notify-staff: true
    # If set to true, the specified command will be executed by the console when a user connected to a vpn tries to connect.
    # Available placeholders: %NAME%, %IP%
    execute-command:
      enabled: false
      command: 'ban-ip %IP%'
    # If set to true, a discord webhook message is sent.
    send-webhook:
      enabled: false
      url: ''

    # If you want some players or ip addresses to be exempted from the vpn check,
    # you can add them here.
    exemptions: []
    # If enabled, players with the permission connectionguard.exemption.vpn will not be flagged as vpn players.
    # Only available when having LuckPerms installed.
    use-permission-exemption: false
  geo:
    # If set to true, geo-blocked players cannot join the server.
    kick-player: true
    # If set to true, players with the permission connectionguard.notify.geo will receive a notification message
    # when a geo-blocked player tries to connect.
    notify-staff: true
    # If set to true, the specified command will be executed by the console when a geo-blocked user tries to connect.
    # Available placeholders: %NAME%, %IP%
    execute-command:
      enabled: false
      command: 'ban-ip %IP%'
    # If set to true, a discord webhook message is sent.
    send-webhook:
      enabled: false
      url: ''

    # Define how restrictive you want to be with geo-blocking.
    # Available options:
    # - BLACKLIST (action specified by 'flag' below will be executed, if the country is on the list)
    # - WHITELIST (action specified by 'flag' below will be executed, if the country is not on the list)
    type: 'BLACKLIST'

    # Countries are specified by their Alpha 2 code.
    # A full list can be found here: https://www.iban.com/country-codes
    list: []
    # If you want some players or ip addresses to be exempted from the geo check,
    # you can add them here.
    exemptions: []
    # If enabled, players with the permission connectionguard.exemption.geo will not be flagged as geo-blocked players.
    # Only available when having LuckPerms.
    use-permission-exemption: false

# You can use multiple services at the same time (just enable multiple at once) to minimize
# the number of provider votes required. Provider votes are not necessarily independent. This determines how many enabled services have
# to report that an ip is a proxy/vpn, before the plugin will treat it as a proxy/vpn.
# Default value: 1
# Missing or failed provider responses do not count as positive votes. If the
# threshold is not met, failure-policy decides how UNKNOWN is handled; an incomplete
# verdict is not cached, so a later connection can retry after provider recovery.
# Positive verdicts are cached once the threshold is met. Negative verdicts are
# cached only when all enabled providers have returned a result.
required-positive-flags: 1

# There are a lot of different services which help the plugin identify which
# IP is a vpn and which is not. Some work better than others and some have daily/monthly limits.

provider:
  vpn:
    # ProxyCheck allows 100 anonymous or 1,000 registered free queries per day.
    # VPN/Geo currently use separate queries; the plugin counts requests locally.
    proxycheck:
      enabled: true
      # v3 supplies separate detections and operator/confidence fields. Missing setting retains v2.
      api-version: v3
      # Optional daily-budget/minute-budget limit locally counted requests (0=unlimited).
      api-key: ''
    # IP-API is completely free, but has a rate limit of 45 requests per minute.
    ip-api:
      enabled: false
    # IPHub requires an api key, which can be aquired for free (1.000 free daily queries) on https://iphub.info/
    iphub:
      enabled: false
      api-key: ''
    # VPNAPI requires an api key, which can be aquired for free (1.000 free daily queries) on https://vpnapi.io/
    vpnapi:
      enabled: false
      api-key: ''

    # Optional native IPQualityScore (operator-owned key; disabled by default).
    # Review current account terms/credits. Local limits reset on restart and are not a monthly account balance.
    ipqualityscore:
      enabled: false
      api-key: ''
      # 0..3; higher strictness may increase false positives. Start in OBSERVE.
      strictness: 0
      allow-public-access-points: true
      # Skips some slower forensic checks; no invented browser/mobile context is sent.
      fast: true
      daily-budget: 30
      minute-budget: 5

    # Positive-only local lists and optional MMDB metadata. Missing/stale data stays UNKNOWN.
    local:
      enabled: false

    # For advanced usage, there is the option to add other vpn detection provider.
    # You can find settings for different other provider in the Connection Guard wiki!
    # https://github.com/gerolndnr/connection-guard/wiki/Custom-Services
    # Services, that have been implemented as 'custom service':
    # - VPN-API.xyz (https://vpn-api.xyz)
    custom:
      enabled: false

      # Request options
      # Available options: GET, POST
      request-type: 'GET'
      # Available placeholders: %IP%
      request-url: 'https://my-provider.com/%IP%?key=123456789'
      # Available placeholders: %IP%
      request-header:
        - "X-Key:123456789"
      # Available options: 'application/json'
      # Only used when request-type is set to 'POST'!
      request-body-type: 'application/json'
      # Available placeholders: %IP%
      request-body: '{ "ip": "%IP%" }'

      # Response options
      # Available options: application/json
      response-type: 'application/json'
      response-format:
        is-vpn-field:
          # Nested data can be accessed with '#', e.g. { "data": { "isVpn": true }} with 'data#isVpn'
          field-name: "data#isVpn"
          # Available options: BOOLEAN, STRING
          field-type: 'BOOLEAN'
          # Only necessary when field-type is set to STRING
          string-options:
            # If you set 'field-type' to STRING, the IP is treated as a vpn, when the field contains the following string.
            is-vpn-string: "yes"
        vpn-provider-field:
          # Nested data can be accessed with '#', e.g. { "data": { "vpnProvider": "NordVPN" }} with 'data#vpnProvider'
          # Leave empty if this detection provider does not give information about the vpn provider.
          field-name: "data#vpnProvider"
  local:
    # 0 disables automatic list downloads. Opt in to 1..168 hours; first download after that interval.
    # MMDBs are always operator-imported, with their embedded build date and your source's license.
    update-hours: 0
    # Explicit attribution is mandatory. See docs/LOCAL_DATA.md for complete examples/imports.
    # Eight sources max, one GEO and one ASN max. VPN/PROXY/TOR/RELAY vote positively on membership;
    # HOSTING/GEO/ASN enrich metadata without contributing generic VPN votes.
    sources: []
  geo:
    # Available services:
    # - IP-API (Free, no api key required, 45 requests per minute)
    # - ProxyCheck (Free, api key is free and optional and can be configured above in the vpn section,
    #               100 requests per day without api key or 1.000 requests per day with api key)
    # - Local (operator-imported country/city MMDB plus optional ASN; no API)
    # - Disabled (geo stays UNKNOWN; choose an appropriate failure policy)
    service: 'IP-API'
  cache:
    # The cache is very important to effectively use the requests you have and avoid running into the request limit.
    # Once a request to a service is made, its data is stored for the specified duration (see below) and used instead of
    # making a new request. This data does not change very frequently and you can cache the results for days, if you want to.
    # If you want to clear the cache, you can do that by typing in the command /connectionguard clearcache, which is especially
    # necessary when you add or remove countries to the geo-block-list.
    # Available types:
    # - SQLite (no further configuration is necessary, stored in a file in the plugins directory)
    # - Redis (configure connection details below, useful when deploying Connection Guard on multiple servers)
    # - Disabled (disable any caching, make absolutely sure that you don't run into request limits!)
    type: 'SQLite'

    # Time after which a new request is made to the services and the existing data is refreshed (when the player connects).
    # Unit: minutes
    expiration:
      vpn: 1440
      geo: 4320

    redis:
      # Enable TLS for a remote Redis server; uses the JVM trust store.
      tls: false
      hostname: 'localhost'
      port: 6379
      password: ''
