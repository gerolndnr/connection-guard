ops.warning-0=No hay proveedor de VPN activo: la clasificación es UNKNOWN.
ops.warning-1=Hay excepciones de permisos, pero LuckPerms no está disponible; las comprobaciones siguen activas.
ops.warning-2=IP-API Free usa HTTP y se limita al uso no comercial; revisa las condiciones del proveedor.
ops.warning-3=Los presupuestos de IPQualityScore cuentan solicitudes locales y se reinician al arrancar; no son el saldo mensual de la cuenta. Usa tu propia clave y revisa las condiciones actuales.
ops.warning-4=IPQualityScore strictness 2+ aumenta el riesgo de falsos positivos; valida en OBSERVE antes de bloquear.
ops.warning-5=Se confía en UUID reenviados: restringe el acceso al backend y verifica el reenvío Proxy/Floodgate; una IP pública no basta como prueba.
ops.warning-6=Los límites de sobrecarga omiten la detección en comprobaciones rechazadas; solo overload.deny-connections puede bloquear temporalmente (OBSERVE no bloquea). Las reglas de fallo del proveedor no cambian esta elección.
ops.warning-7=Se eligió identidad nativa de Floodgate, pero falta su API canónica; no se concede ninguna excepción nativa.
ops.warning-8=Se eligió reenvío moderno nativo de Paper: solo las rutas de perfil PreLogin calificadas aportan autoridad de gateway; protege el secreto del proxy y el backend. No es autenticación independiente de cuenta.
