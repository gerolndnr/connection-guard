ops.policy-usage=Usage: /cg policy test [cases-name] [candidate-name]; JSON files in the plugin policy directory; examples is bundled.
ops.policy-summary=Synthetic cases: {0}; changed outcomes: {1}; changed flags: {2}; changed rule selections: {3}. Active policy preserved.
ops.policy-limits=Saved facts only; no provider requests, kicks, commands or webhooks. No accuracy/false-positive estimate. Provider changes, identity/permission resolution, overload and admission hooks are outside this replay.
ops.policy-rejected=Policy replay rejected; check the documented JSON schema and local filenames. Active settings preserved (details redacted).
ops.policy-shadow-usage=Usage: /cg policy shadow start <candidate-name> [5m|15m|1h], status or stop. Default: 15m. At most 128 candidate rules, 10000 samples and 8 concurrent comparisons.
ops.policy-shadow-summary=Shadow {0}: compared {1}; changed outcomes: {2}; changed flags: {3}; changed rule selections: {4}.
ops.policy-shadow-limits=Existing final policy facts only; no extra lookups or player actions. Counters stay in memory; observed addresses and identities are not retained. Skipped/earlier-denied logins are outside this sample. Changes are not false positives. Reload or rule changes stop this comparison; no activation or rollback.
ops.policy-version-usage=Usage: /cg policy status|history; inspect <candidate>; activate <candidate> <candidate-hash> <expected-token>; rollback <revision> <expected-token>; release <expected-token>. Activation permission is separate. Review current files, tokens and conditions first.
ops.policy-version-rejected=Policy transaction rejected; check permissions, schema, current candidate hash/token, pending logins and local/dashboard ownership. Active policy preserved; details redacted.
ops.local-activated=Validated local generation activated; cache namespace changed. Inspect /cg local status for actual age and readiness.
ops.local-busy=Local data worker is busy; retry later.
ops.local-disabled=Local data is disabled. Configure attributed sources and choose local VPN and/or Local geo first.
ops.local-invalid=Invalid source ID or date. Use UTC ISO-8601, e.g. 2026-10-02T09:00:00Z.
ops.local-prepared=Private local-data/inbox is ready inside the plugin data directory.
ops.local-rejected=Local data operation rejected; active generation preserved (details redacted).
ops.local-stored=Validated data stored; active generation preserved. Wait for active lookups, then /cg local reload (details redacted).
ops.local-usage=Usage: /cg local status|prepare|reload; /cg local update <source-id>; /cg local import <source-id> <inbox-file> <ISO-8601-as-of>
