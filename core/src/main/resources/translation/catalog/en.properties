ops.warning-0=No VPN provider enabled: VPN classification is UNKNOWN.
ops.warning-1=Permission exemptions enabled but LuckPerms is unavailable; checks remain active.
ops.warning-2=IP-API free uses HTTP and is restricted to non-commercial use; check provider terms.
ops.warning-3=IPQualityScore budgets count local requests and reset on restart; they are not the account monthly balance. Use your own key and check current provider terms.
ops.warning-4=IPQualityScore strictness 2+ increases false-positive risk; validate in OBSERVE before enforcement.
ops.warning-5=Forwarded UUID trust enabled: restrict backend access and verify proxy/Floodgate forwarding; a public IP is insufficient proof.
ops.warning-6=Overload limits skip detection on refused admissions; only overload.deny-connections may temporarily deny (OBSERVE suppresses denial). Provider failure policies do not change this choice.
ops.warning-7=Native Floodgate identity selected but the canonical API is unavailable; no native exemption is granted.
ops.warning-8=Native Paper modern forwarding selected: only qualified native pre-login profile paths supply gateway authority; protect the proxy secret and backend access. This is not independent account authentication.
