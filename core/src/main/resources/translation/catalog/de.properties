ops.warning-5=Vertrauen in weitergeleitete UUID aktiviert: beschränke Backend-Zugriff und prüfe Proxy-/Floodgate-Weiterleitung; eine öffentliche IP reicht als Nachweis nicht aus.
ops.warning-6=Überlastlimits überspringen die Erkennung für abgewiesene Prüfungen; nur overload.deny-connections kann zeitweise sperren (OBSERVE unterdrückt Sperren). Anbieter-Ausfallregeln ändern diese Wahl nicht.
ops.warning-7=Native Floodgate-Identität gewählt, aber die kanonische API fehlt; keine native Ausnahme wird gewährt.
ops.warning-8=Native Paper-Weiterleitung gewählt: nur qualifizierte native PreLogin-Profilpfade liefern Gatewayautorität; schütze Proxy-Schlüssel und Backend-Zugriff. Das ist keine unabhängige Accountauthentifizierung.
