ops.policy-summary=Synthetische Fälle: {0}; geänderte Ergebnisse: {1}; geänderte Flags: {2}; geänderte Regelauswahl: {3}. Aktive Regeln bleiben erhalten.
ops.policy-limits=Nur gespeicherte Fakten; keine Anbieterabfragen, Kicks, Befehle oder Webhooks. Keine Genauigkeits-/Fehlblockierungsquote. Anbieteränderungen, Identitäts-/Permission-Auflösung, Überlastung und Admission-Hooks liegen außerhalb dieser Simulation.
ops.policy-rejected=Regelsimulation abgelehnt; dokumentiertes JSON-Schema und lokale Dateinamen prüfen. Aktive Einstellungen bleiben erhalten (Details ausgeblendet).
ops.policy-shadow-usage=Verwendung: /cg policy shadow start <Entwurfsname> [5m|15m|1h], status oder stop. Standard: 15m. Höchstens 128 Entwurfsregeln, 10000 Stichproben und 8 parallele Vergleiche.
ops.policy-shadow-summary=Shadow {0}: verglichen {1}; geänderte Ergebnisse: {2}; geänderte Flags: {3}; geänderte Regelauswahl: {4}.
ops.policy-shadow-limits=Nur vorhandene Fakten der finalen Policy; keine zusätzlichen Abfragen oder Spieleraktionen. Zähler bleiben im Speicher; beobachtete Adressen und Identitäten werden nicht gespeichert. Übersprungene/früher abgelehnte Logins liegen außerhalb der Stichprobe. Änderungen sind keine Fehlblockierungen. Reload oder Regeländerungen stoppen den Vergleich; keine Aktivierung oder Rücknahme.
ops.policy-version-usage=Verwendung: /cg policy status|history; inspect <Entwurf>; activate <Entwurf> <Entwurfs-Hash> <Freigabetoken>; rollback <Version> <Freigabetoken>; release <Freigabetoken>. Aktivierung benötigt eine eigene Berechtigung. Aktuelle Dateien, Tokens und Bedingungen zuerst prüfen.
ops.policy-version-rejected=Policy-Transaktion abgelehnt; Berechtigungen, Schema, aktuellen Entwurfs-Hash/Token, laufende Logins und lokale/Dashboard-Zuständigkeit prüfen. Aktive Policy bleibt erhalten; Details ausgeblendet.
ops.local-activated=Geprüfter lokaler Datenstand aktiviert; Cache-Namensraum geändert. /cg local status zeigt das tatsächliche Alter und die Bereitschaft.
