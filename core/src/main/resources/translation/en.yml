command:
  no-permission: '&cYou don''t have permissions to execute this command!'
  unknown-subcommand: '&bConnection Guard &7| &7Unknown subcommand. Enter /cg help to view all available commands.'
  config-reload: '&bConnection Guard &7| &7Config has been reloaded!'
  clear:
    clear-all: '&bConnection Guard &7| &7Cleared the entire cache.'
    clear-specific: '&bConnection Guard &7| &7Cleared the cache entries for &f%ENTRY%&7.'
  invalid-argument: '&bConnection Guard &7| &7Please enter the name or the uuid of an online player or use an ip address instead.'
  reload-rejected: Reload rejected; active settings preserved. Check config.yml and /cg doctor.
  info-unavailable: Information unavailable (details redacted).
  clear-unavailable: Cache clear unavailable (details redacted).
  target-invalid: Use a literal IP or the name/UUID of an online player.
messages:
  vpn-block: '&7It looks like you are using a &bVPN&7. Please &bdisable&7 it!'
  vpn-notify: '&bConnection Guard &7| &e%NAME% &7(%IP%) was flagged as a &evpn user&7.'
  vpn-webhook: '%NAME% (%IP%) tried to connect with a vpn.'
  geo-block: '&7It looks like you are connecting from &b%COUNTRY%&7, which is &bnot allowed&7 on this server.'
  geo-notify: '&bConnection Guard &7| &e%NAME% &7(%IP%) was &egeo-flagged&7 (&e%COUNTRY%&7, %CITY%).'
  geo-webhook: '%NAME% (%IP%, %ISP%) tried to connect from %CITY%, %COUNTRY%.'
  help:
  - '&bConnection Guard &7| &7Overview of commands'
  - ' &7- /cg &fhelp &7(this overview)'
  - ' &7- /cg &freload &7(reload config)'
  - ' &7- /cg &fclear &7(<&fPlayer&7/&fUUID&7/&fIP&7>) (clear cache)'
  - ' &7- /cg &finfo &7<&fPlayer&7/&fUUID&7/&fIP&7> (vpn and geo data)'
  - ' &7- /cg &fdoctor &7(setup and forwarding checks)'
  - ' &7- /cg &fproviders &7| /cg &fstats &7(sources and operating counters)'
  - ' &7- /cg &fexplain &7<IP> (source and rule explanation)'
  - ' &7- /cg &fallow &7| &fdeny &7| &fexempt &7(scoped rules with expiry)'
  - ' &7- /cg &flocal status &7(local data readiness)'
  - ' &7- /cg &fcloud &7status | link | sync | settings | reset-settings | enable | disable'
  info:
    text:
    - '&bConnection Guard &7| &7Query result for &b%INPUT%'
    - '&7IP: &f%IP%&7 (VPN: &f%IS_VPN%&7)'
    - '&7Location: &f%CITY%&7, &f%COUNTRY%'
    - '&7ISP: &f%ISP%'
    is-vpn: '&bYes'
    not-vpn: '&7No'
    unknown: '&eUnknown (UNKNOWN)'
  invalid-argument: '&bConnection Guard &7| &7Please enter the name or the uuid of an online player or use an ip address instead.'
  access-denied: Connection denied by server access policy.
  external-denied: Connection denied by configured server access check.
  external-unavailable: Server access verification is temporarily unavailable. Please retry.
  identity-unavailable: Connection identity verification is no longer available. Please retry.
  busy: Connection checks are temporarily busy. Please retry shortly.
  lookup-unavailable: Connection verification is temporarily unavailable. Please retry shortly.
ops:
  permission: You do not have permission for this command.
  explain-usage: 'Usage: /cg explain <literal IPv4/IPv6>'
  literal: Use a literal IPv4/IPv6 address.
  usage: 'Usage: /cg {0}'
  explain-unavailable: Explanation unavailable (details redacted).
  identity-omitted: identity/permission exemptions not evaluated for a literal IP.
  no-provider-attempts: No provider attempts recorded yet.
  cache-health: health requires an actual lookup. This command does not spend API quota.
  identity-authority: declared/global trust is not verified temporary-grant authority.
  forwarding: Verify client IP forwarding with a controlled client; a public address alone does not establish correct forwarding.
  rules-unavailable: Rule store unavailable; check server startup logs.
  rules-shown: 'Displayed {0} active rules (maximum 20); complete file: access-rules.json.'
  rules-missing: No matching {0} rule.
  rule-removed: Rule removed.
  rule-absent: Rule was already absent.
  rule-remove-failed: Rule removal failed; existing rules preserved.
  rule-invalid: Invalid target, scope, duration or reason. Use IP/CIDR, UUID or a documented metadata selector; no player names.
  rule-stored: Stored {0} {1} {2} {3}
  rule-write-failed: Rule write failed; active rules preserved.
  rule-usage: /cg {0} add <IP/CIDR/UUID|asn:15169|type:TOR|risk:source:80> <vpn|geo|all> <15m|2h|7d|permanent> <reason>
  rule-usage-tail: /cg {0} list | remove <rule-id>; explicit deny overrides allow/exempt; UUID requires trusted identity.
  local-disabled: Local data is disabled. Configure attributed sources and choose local VPN and/or Local geo first.
  local-usage: 'Usage: /cg local status|prepare|reload; /cg local update <source-id>; /cg local import <source-id> <inbox-file> <ISO-8601-as-of>'
  local-invalid: Invalid source ID or date. Use UTC ISO-8601, e.g. 2026-10-02T09:00:00Z.
  local-prepared: Private local-data/inbox is ready inside the plugin data directory.
  local-activated: Validated local generation activated; cache namespace changed. Inspect /cg local status for actual age and readiness.
  local-stored: Validated data stored; active generation preserved. Wait for active lookups, then /cg local reload (details redacted).
  local-rejected: Local data operation rejected; active generation preserved (details redacted).
  local-busy: Local data worker is busy; retry later.
  warning-0: 'No VPN provider enabled: VPN classification is UNKNOWN.'
  warning-1: Permission exemptions enabled but LuckPerms is unavailable; checks remain active.
  warning-2: IP-API free uses HTTP and is restricted to non-commercial use; check provider terms.
  warning-3: IPQualityScore budgets count local requests and reset on restart; they are not the account monthly balance. Use your own key and check current provider terms.
  warning-4: IPQualityScore strictness 2+ increases false-positive risk; validate in OBSERVE before enforcement.
  warning-5: 'Forwarded UUID trust enabled: restrict backend access and verify proxy/Floodgate forwarding; a public IP is insufficient proof.'
  warning-6: Overload limits skip detection on refused admissions; only overload.deny-connections may temporarily deny (OBSERVE suppresses denial). Provider failure policies do not change
    this choice.
  warning-7: Native Floodgate identity selected but the canonical API is unavailable; no native exemption is granted.
  warning-8: 'Native Paper modern forwarding selected: only qualified native pre-login profile paths supply gateway authority; protect the proxy secret and backend access. This is not
    independent account authentication.'
