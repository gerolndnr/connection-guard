cloud:
  usage: '/cg cloud status | link | sync | settings | reset-settings | enable | disable'
  sync-start: 'Syncing with Connection Guard Cloud…'
  sync-current: 'Up to date (settings v{0}).'
  sync-applied: 'Applied dashboard settings v{0}.'
  sync-wait: 'Please wait {0} s before syncing again.'
  sync-error: 'Cloud sync failed: {0}.'
  sync-pending: 'Dashboard settings are still pending; the server is busy. They will be retried automatically.'
  link: 'Link this server: {0}'
  link-expiry: 'Link this server: {0} (valid 24 hours)'
  off-help: Connection Guard Cloud is off. Turn it on with /cg cloud enable.
  already-linked: This server is already linked. Manage it at https://app.connectionguard.net.
  registering-help: Registering with the dashboard; the link appears within a minute. Run /cg cloud link again.
  not-ready: Connection Guard is still starting; try again in a moment.
  change-error: Could not change the cloud setting; check file permissions in the plugin folder.
  local-error: Cloud local state is invalid; check the plugin folder (values redacted).
  reset-none: No dashboard settings are active; config.yml applies.
  reset-file-error: Could not change the settings file; check file permissions.
  reset-rejected: Reload refused; dashboard settings kept. Try again in a moment (values redacted).
  reset-done: Dashboard settings removed; config.yml applies again. The dashboard shows this after the next sync.
  settings-local: All settings come from config.yml.
  settings-header: 'Dashboard settings v{0} override these config.yml values:'
  settings-reset-help: Use /cg cloud reset-settings to go back to config.yml only.
  disabled: Connection Guard Cloud is off and stays off after restarts. Nothing is sent.
  enabled: Connection Guard Cloud is on. The first sync happens within a minute.
  status-off: 'Cloud: off{0}. Nothing is sent.'
  status-on: 'Cloud: on, {0}, endpoint {1}{2}{3}.'
  registering: registering
  linked: linked
  unlinked: not linked
  no-sync: ', no sync yet'
  last-sync: ', last sync {0}s ago'
  last-error: ', last problem: {0}'
  anonymous: ' (only anonymous totals are sent until linked)'
  stays-off: 'Cloud stays off: {0}.'
