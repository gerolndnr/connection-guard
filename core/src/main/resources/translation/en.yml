    Processing error: {5}

    Notification scope: {6}'
  checks: 'VPN: {0} (configured minimum: {1})

    Geo: {2}

    Identity authority: {3}

    Duration: {4} ms'
  votes: 'Positive: {0} / negative: {1} / unknown: {2}

    Flags: {3}

    Missing data is not a negative result; risk alone is not VPN proof.'
  selected: ' (selected)'
  rules-shown: 'Shown: {0}/{1} relevant rules.'
