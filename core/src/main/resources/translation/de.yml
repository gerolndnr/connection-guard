# Message templates. Built-in locales: en, de, es. Missing keys use bundled defaults.
# Keep placeholder names and command syntax; machine status codes remain unchanged.
command:
  no-permission: '&cDu hast keine Berechtigung für diesen Befehl!'
  unknown-subcommand: '&bConnection Guard &7| &7Unbekannter Unterbefehl. /cg help zeigt die verfügbaren Befehle.'
  config-reload: '&bConnection Guard &7| &7Konfiguration neu geladen!'
  clear:
    clear-all: '&bConnection Guard &7| &7Gesamten Cache geleert.'
    clear-specific: '&bConnection Guard &7| &7Cache-Einträge für &f%ENTRY% &7gelöscht.'
  invalid-argument: '&bConnection Guard &7| &7Gib den Namen oder die UUID eines verbundenen Spielers oder eine IP-Adresse
    an.'
  reload-rejected: Neuladen abgelehnt; aktive Einstellungen bleiben erhalten. Prüfe config.yml und /cg doctor.
  info-unavailable: Informationen nicht verfügbar (Details ausgeblendet).
  clear-unavailable: Cache kann nicht geleert werden (Details ausgeblendet).
  target-invalid: Verwende eine IP-Adresse oder den Namen/die UUID eines verbundenen Spielers.
messages:
  vpn-block: '&7Deine Verbindung wurde als &bVPN &7eingestuft. Bitte &bdeaktiviere &7das VPN oder kontaktiere den Support.'
  vpn-notify: '&bConnection Guard &7| &e%NAME% &7(%IP%) wurde als &eVPN-Nutzer &7eingestuft.'
  vpn-webhook: '%NAME% (%IP%) wurde beim Verbindungsversuch als VPN-Nutzer eingestuft.'
  geo-block: '&7Verbindungen aus &b%COUNTRY% &7sind auf diesem Server &bnicht erlaubt&7.'
  geo-notify: '&bConnection Guard &7| &e%NAME% &7(%IP%) wurde wegen der &eLänderregel &7markiert (&e%COUNTRY%&7, %CITY%).'
  geo-webhook: '%NAME% (%IP%, %ISP%) versuchte eine Verbindung aus %CITY%, %COUNTRY%.'
  info:
    is-vpn: '&bJa'
    not-vpn: '&7Nein'
    text:
    - '&bConnection Guard &7| &7Abfrage für &b%INPUT%'
    - '&7IP: &f%IP%&7 (VPN: &f%IS_VPN%&7)'
    - '&7Ort: &f%CITY%&7, &f%COUNTRY%'
    - '&7ISP: &f%ISP%'
    unknown: '&eUnbekannt (UNKNOWN)'
  help:
  - '&bConnection Guard &7| &7Befehlsübersicht'
  - ' &7- /cg &fhelp &7(diese Übersicht)'
  - ' &7- /cg &freload &7(Konfiguration neu laden)'
  - ' &7- /cg &fclear &7(<&fSpieler&7/&fUUID&7/&fIP&7>) (Cache leeren)'
  - ' &7- /cg &finfo &7<&fSpieler&7/&fUUID&7/&fIP&7> (VPN- und Länderdaten)'
  - ' &7- /cg &fdoctor &7(Einrichtung und Weiterleitung prüfen)'
  - ' &7- /cg &fproviders &7| /cg &fstats &7(Quellen und Betriebszähler)'
  - ' &7- /cg &fexplain &7<IP> (Quellen und Regeln erklären)'
  - ' &7- /cg &fallow &7| &fdeny &7| &fexempt &7(Regeln mit Geltung und Ablauf)'
  - ' &7- /cg &flocal status &7(lokalen Datenstand prüfen)'
  invalid-argument: '&bConnection Guard &7| &7Gib den Namen oder die UUID eines verbundenen Spielers oder eine IP-Adresse
    an.'
  access-denied: Verbindung durch die Zugangsregeln des Servers abgelehnt.
  external-denied: Verbindung durch die konfigurierte Zugangsprüfung abgelehnt.
  external-unavailable: Die Zugangsprüfung ist vorübergehend nicht verfügbar. Bitte versuche es erneut.
  identity-unavailable: Die Verbindungsidentität kann nicht mehr geprüft werden. Bitte versuche es erneut.
  busy: Die Verbindungsprüfungen sind vorübergehend ausgelastet. Bitte versuche es gleich erneut.
  lookup-unavailable: Die Verbindungsprüfung ist vorübergehend nicht verfügbar. Bitte versuche es gleich erneut.
ops:
  permission: Du hast keine Berechtigung für diesen Befehl.
  explain-usage: 'Verwendung: /cg explain <IPv4-/IPv6-Adresse>'
  literal: Verwende eine IPv4-/IPv6-Adresse, keinen Hostnamen.
  usage: 'Verwendung: /cg {0}'
  explain-unavailable: Erklärung nicht verfügbar (Details ausgeblendet).
  identity-omitted: Identitäts-/Berechtigungsausnahmen werden bei einer IP-Abfrage nicht geprüft.
  no-provider-attempts: Noch keine Anbieterabfragen aufgezeichnet.
  cache-health: Der Zustand muss mit einer tatsächlichen Abfrage geprüft werden. Dieser Befehl verbraucht kein API-Kontingent.
  identity-authority: Deklariertes/globales Vertrauen ist kein verifizierter Nachweis für temporäre Freigaben.
  forwarding: Prüfe die Weiterleitung der Client-IP mit einem kontrollierten Client; eine öffentliche IP allein beweist keine
    korrekte Weiterleitung.
  rules-unavailable: Regelspeicher nicht verfügbar; prüfe das Startprotokoll des Servers.
  rules-shown: '{0} aktive Regeln angezeigt (höchstens 20); vollständige Datei: access-rules.json.'
  rules-missing: Keine passende {0}-Regel.
  rule-removed: Regel entfernt.
  rule-absent: Regel war bereits entfernt.
  rule-remove-failed: Entfernen fehlgeschlagen; bestehende Regeln bleiben erhalten.
  rule-invalid: Ungültiges Ziel, Geltungsbereich, Dauer oder Grund. Verwende IP/CIDR, UUID oder einen dokumentierten Metadaten-Selektor;
    keine Spielernamen.
  rule-stored: 'Gespeichert: {0} {1} {2} {3}'
  rule-write-failed: Speichern fehlgeschlagen; aktive Regeln bleiben erhalten.
  rule-usage: /cg {0} add <IP/CIDR/UUID|asn:15169|type:TOR|risk:source:80> <vpn|geo|all> <15m|2h|7d|permanent> <Grund>
  rule-usage-tail: /cg {0} list | remove <Regel-ID>; deny hat Vorrang vor allow/exempt; UUID erfordert eine vertrauenswürdige
    Identität.
  local-disabled: Lokale Daten sind deaktiviert. Konfiguriere Quellen mit Herkunftsangabe und wähle zuerst lokale VPN- und/oder
    Länderdaten.
  local-usage: 'Verwendung: /cg local status|prepare|reload; /cg local update <Quellen-ID>; /cg local import <Quellen-ID>
    <Inbox-Datei> <ISO-8601-Datenzeitpunkt>'
  local-invalid: Ungültige Quellen-ID oder Zeitangabe. Verwende UTC ISO-8601, etwa 2026-10-02T09:00:00Z.
  local-prepared: Das private Verzeichnis local-data/inbox ist im Plugin-Datenordner bereit.
  local-activated: Geprüfter lokaler Datenstand aktiviert; Cache-Namensraum geändert. /cg local status zeigt das tatsächliche
    Alter und die Bereitschaft.
  local-stored: Geprüfte Daten gespeichert; aktiver Stand bleibt erhalten. Warte laufende Abfragen ab, dann /cg local reload
    (Details ausgeblendet).
  local-rejected: Lokale Datenoperation abgelehnt; aktiver Stand bleibt erhalten (Details ausgeblendet).
  local-busy: Lokaler Datenworker ausgelastet; versuche es später erneut.
  warning-0: 'Kein VPN-Anbieter aktiviert: VPN-Einstufung ist UNKNOWN.'
  warning-1: Berechtigungsausnahmen aktiviert, aber LuckPerms fehlt; Prüfungen bleiben aktiv.
  warning-2: IP-API Free nutzt HTTP und ist auf nichtkommerzielle Nutzung beschränkt; prüfe die Anbieterbedingungen.
  warning-3: IPQualityScore-Budgets zählen lokale Anfragen und beginnen nach Neustart neu; sie sind kein monatlicher Kontostand.
    Verwende deinen eigenen Schlüssel und prüfe die aktuellen Bedingungen.
  warning-4: IPQualityScore strictness 2+ erhöht das Risiko falscher Treffer; prüfe in OBSERVE, bevor du sperrst.
  warning-5: 'Vertrauen in weitergeleitete UUID aktiviert: beschränke Backend-Zugriff und prüfe Proxy-/Floodgate-Weiterleitung;
    eine öffentliche IP reicht als Nachweis nicht aus.'
  warning-6: Überlastlimits überspringen die Erkennung für abgewiesene Prüfungen; nur overload.deny-connections kann zeitweise
    sperren (OBSERVE unterdrückt Sperren). Anbieter-Ausfallregeln ändern diese Wahl nicht.
  warning-7: Native Floodgate-Identität gewählt, aber die kanonische API fehlt; keine native Ausnahme wird gewährt.
  warning-8: 'Native Paper-Weiterleitung gewählt: nur qualifizierte native PreLogin-Profilpfade liefern Gatewayautorität;
    schütze Proxy-Schlüssel und Backend-Zugriff. Das ist keine unabhängige Accountauthentifizierung.'
webhook:
  title-deny: 'Connection Guard: Verbindung abgelehnt'
  title-error: 'Connection Guard: Verarbeitungsfehler'
  title-allow: 'Connection Guard: Verbindung erlaubt'
  description: Guard-Entscheidung in dieser Phase; andere Plugins und die Accountauthentifizierung werden gesondert geprüft.
  field:
    decision: Entscheidung
    checks: Prüfungen
    address: Verbindungsadresse (bewusst aktiviert)
    votes: Beobachtete abstimmende Quellen
    rules: Ausgewählte / ungeklärte Regeln
    admission: Externe Zugangsprüfungen
  decision: 'Ergebnis: {0}

    Grund: {1}

    Plattform / Phase: {2} / {3}

    Modus: {4}

    Verarbeitungsfehler: {5}

    Meldungsbereich: {6}'
  checks: 'VPN: {0} (konfiguriertes Minimum: {1})

    Geo: {2}

    Identitätsautorität: {3}

    Dauer: {4} ms'
  votes: 'Positiv: {0} / negativ: {1} / unbekannt: {2}

    Markierungen: {3}

    Fehlende Daten sind keine Entwarnung; Risiko allein ist kein VPN-Nachweis.'
  selected: ' (ausgewählt)'
  rules-shown: 'Angezeigt: {0}/{1} relevante Regeln.'
  source: 'Status: {0} / {1}

    Abstimmend: {2} / aus Cache: {3}

    Dauer: {4} ms

    Typen: {5}

    Risiko / Konfidenz: {6} / {7}

    ASN / Land: {8} / {9}

    Gültig bis: {10}'
  address-included: bewusst eingeblendet
  address-redacted: ausgeblendet
  footer: 'Quellen: {0}/{1}. Adresse {2}; Namen/UUIDs/Providertexte ausgelassen. Bestmöglicher Versand; keine Wiederholung.'
  not-supplied: nicht angegeben
  source-label: '{0}-Quelle: {1}'
