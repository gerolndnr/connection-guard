command:
  no-permission: '&c¡No tienes permiso para ejecutar este comando!'
  unknown-subcommand: '&bConnection Guard &7| &7Subcomando desconocido. Usa /cg help para ver los comandos disponibles.'
  config-reload: '&bConnection Guard &7| &7¡Configuración recargada!'
  clear:
    clear-all: '&bConnection Guard &7| &7Se ha vaciado toda la caché.'
    clear-specific: '&bConnection Guard &7| &7Se han eliminado las entradas de caché de &f%ENTRY%&7.'
  invalid-argument: '&bConnection Guard &7| &7Indica el nombre o UUID de un jugador conectado, o una dirección IP.'
  reload-rejected: Recarga rechazada; se conservan los ajustes activos. Revisa config.yml y /cg doctor.
  info-unavailable: Información no disponible (detalles ocultos).
  clear-unavailable: No se puede vaciar la caché (detalles ocultos).
  target-invalid: Usa una dirección IP o el nombre/UUID de un jugador conectado.
messages:
  vpn-block: '&7Tu conexión se ha clasificado como &bVPN&7. &bDesactiva &7la VPN o contacta con el soporte.'
  vpn-notify: '&bConnection Guard &7| &e%NAME% &7(%IP%) se ha clasificado como &eusuario de VPN&7.'
  vpn-webhook: '%NAME% (%IP%) se ha clasificado como usuario de VPN al intentar conectarse.'
  geo-block: '&7Las conexiones desde &b%COUNTRY% &7están &bprohibidas &7en este servidor.'
  geo-notify: '&bConnection Guard &7| &e%NAME% &7(%IP%) se ha marcado por la &eregla de país &7(&e%COUNTRY%&7, %CITY%).'
  geo-webhook: '%NAME% (%IP%, %ISP%) intentó conectarse desde %CITY%, %COUNTRY%.'
  info:
    is-vpn: '&bSí'
    not-vpn: '&7No'
    text:
    - '&bConnection Guard &7| &7Resultado de &b%INPUT%'
    - '&7IP: &f%IP%&7 (VPN: &f%IS_VPN%&7)'
    - '&7Ubicación: &f%CITY%&7, &f%COUNTRY%'
    - '&7ISP: &f%ISP%'
    unknown: '&eDesconocido (UNKNOWN)'
  help:
  - '&bConnection Guard &7| &7Comandos disponibles'
  - ' &7- /cg &fhelp &7(esta lista)'
  - ' &7- /cg &freload &7(recargar configuración)'
  - ' &7- /cg &fclear &7(<&fJugador&7/&fUUID&7/&fIP&7>) (vaciar caché)'
  - ' &7- /cg &finfo &7<&fJugador&7/&fUUID&7/&fIP&7> (datos de VPN y país)'
  - ' &7- /cg &fdoctor &7(comprobar configuración y reenvío)'
  - ' &7- /cg &fproviders &7| /cg &fstats &7(fuentes y contadores)'
  - ' &7- /cg &fexplain &7<IP> (explicar fuentes y reglas)'
  - ' &7- /cg &fallow &7| &fdeny &7| &fexempt &7(reglas con ámbito y caducidad)'
  - ' &7- /cg &flocal status &7(estado de los datos locales)'
  - ' &7- /cg &fcloud &7status | link | sync | settings | reset-settings | enable | disable'
  invalid-argument: '&bConnection Guard &7| &7Indica el nombre o UUID de un jugador conectado, o una dirección IP.'
  access-denied: Conexión rechazada por las reglas de acceso del servidor.
  external-denied: Conexión rechazada por la comprobación de acceso configurada.
  external-unavailable: La comprobación de acceso no está disponible temporalmente. Inténtalo de nuevo.
  identity-unavailable: Ya no se puede verificar la identidad de la conexión. Inténtalo de nuevo.
  busy: Las comprobaciones están ocupadas temporalmente. Inténtalo de nuevo en unos instantes.
  lookup-unavailable: La verificación de la conexión no está disponible temporalmente. Inténtalo de nuevo en unos instantes.
ops:
  permission: No tienes permiso para este comando.
  explain-usage: 'Uso: /cg explain <dirección IPv4/IPv6>'
  literal: Usa una dirección IPv4/IPv6, no un nombre de host.
  usage: 'Uso: /cg {0}'
  explain-unavailable: Explicación no disponible (detalles ocultos).
  identity-omitted: Las excepciones de identidad/permisos no se evalúan al consultar una IP.
  no-provider-attempts: Todavía no se han registrado consultas a proveedores.
  cache-health: Para comprobar el estado hace falta una consulta real. Este comando no consume cuota de API.
  identity-authority: La confianza declarada/global no es una autoridad verificada para permisos temporales.
  forwarding: Comprueba el reenvío de la IP con un cliente controlado; una IP pública por sí sola no demuestra un reenvío correcto.
  rules-unavailable: El almacén de reglas no está disponible; revisa el registro de inicio.
  rules-shown: 'Se muestran {0} reglas activas (máximo 20); archivo completo: access-rules.json.'
  rules-missing: No hay ninguna regla {0} coincidente.
  rule-removed: Regla eliminada.
  rule-absent: La regla ya no existía.
  rule-remove-failed: No se pudo eliminar; se conservan las reglas existentes.
  rule-invalid: Destino, ámbito, duración o motivo inválido. Usa IP/CIDR, UUID o un selector de metadatos documentado; no nombres de jugadores.
  rule-stored: 'Guardada: {0} {1} {2} {3}'
  rule-write-failed: No se pudo guardar; se conservan las reglas activas.
  rule-usage: /cg {0} add <IP/CIDR/UUID|asn:15169|type:TOR|risk:source:80> <vpn|geo|all> <15m|2h|7d|permanent> <motivo>
  rule-usage-tail: /cg {0} list | remove <ID-regla>; deny prevalece sobre allow/exempt; UUID requiere una identidad de confianza.
  local-disabled: Los datos locales están desactivados. Configura fuentes con atribución y elige primero VPN y/o países locales.
  local-usage: 'Uso: /cg local status|prepare|reload; /cg local update <ID-fuente>; /cg local import <ID-fuente> <archivo-inbox> <fecha-ISO-8601>'
  local-invalid: ID de fuente o fecha inválido. Usa UTC ISO-8601, por ejemplo 2026-10-02T09:00:00Z.
  local-prepared: La carpeta privada local-data/inbox está lista en el directorio de datos del plugin.
  local-activated: Datos locales validados y activados; cambió el espacio de caché. /cg local status muestra la antigüedad real y el estado.
  local-stored: Datos validados guardados; se conserva el estado activo. Espera a que terminen las consultas y usa /cg local reload (detalles ocultos).
  local-rejected: Operación de datos locales rechazada; se conserva el estado activo (detalles ocultos).
  local-busy: El proceso de datos locales está ocupado; inténtalo más tarde.
  warning-0: 'No hay proveedor de VPN activo: la clasificación es UNKNOWN.'
  warning-1: Hay excepciones de permisos, pero LuckPerms no está disponible; las comprobaciones siguen activas.
  warning-2: IP-API Free usa HTTP y se limita al uso no comercial; revisa las condiciones del proveedor.
  warning-3: Los presupuestos de IPQualityScore cuentan solicitudes locales y se reinician al arrancar; no son el saldo mensual de la cuenta. Usa tu propia clave y revisa las condiciones
    actuales.
  warning-4: IPQualityScore strictness 2+ aumenta el riesgo de falsos positivos; valida en OBSERVE antes de bloquear.
  warning-5: 'Se confía en UUID reenviados: restringe el acceso al backend y verifica el reenvío Proxy/Floodgate; una IP pública no basta como prueba.'
  warning-6: Los límites de sobrecarga omiten la detección en comprobaciones rechazadas; solo overload.deny-connections puede bloquear temporalmente (OBSERVE no bloquea). Las reglas
    de fallo del proveedor no cambian esta elección.
  warning-7: Se eligió identidad nativa de Floodgate, pero falta su API canónica; no se concede ninguna excepción nativa.
  warning-8: 'Se eligió reenvío moderno nativo de Paper: solo las rutas de perfil PreLogin calificadas aportan autoridad de gateway; protege el secreto del proxy y el backend. No es
    autenticación independiente de cuenta.'
